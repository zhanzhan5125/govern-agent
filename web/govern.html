<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Govern Agent</title><link rel="stylesheet" href="/assets/govern.css"></head>
<body><aside><h1>Govern Agent</h1><p>需求 · 证据 · 治理</p><nav><button data-tab="work">审查工作台</button><button data-tab="report">审查报告</button><button data-tab="trace">Trace</button><button data-tab="monitor">运行监控</button><button data-tab="policy">策略中心</button><button data-tab="evaluation">评测中心</button></nav><a href="/legacy">EvoAgent兼容控制台</a><details><summary>登录</summary><form id="login"><input name="username" placeholder="用户名"><input name="password" type="password" placeholder="密码"><button>登录</button></form></details></aside>
<main><header><h2 id="title">审查工作台</h2><span id="status" role="status"></span></header>
<section id="work"><form id="review-form"><div class="card"><h3>1 · 代码输入</h3><label>来源<select name="source"><option value="local">本地Git</option><option value="github-pr">GitHub PR</option></select></label><label>仓库绝对路径<input name="path" placeholder="D:\projects\my-repo"></label><button type="button" id="inspect">读取分支与状态</button><p id="repo-status"></p><pre id="commits"></pre><label>PR URL<input name="url" placeholder="https://github.com/owner/repo/pull/123"></label><div class="row"><label>范围<select name="mode"><option value="branch">分支：merge-base → head</option><option value="range">Commit范围</option><option value="staged">暂存区</option><option value="working-tree">工作区</option></select></label><label>Base<input name="base" value="main" list="refs"></label><label>Head<input name="head" value="HEAD" list="refs"></label></div><datalist id="refs"></datalist><label><input name="untracked" type="checkbox">工作区包含未跟踪文件</label></div>
<div class="card"><h3>2 · 选择需求</h3><label>Epic / PRD Issue Key<input name="epic" placeholder="PAY-100"></label><button type="button" id="load-requirements">获取关联需求</button><p>未选择或未映射的变更继续代码审查，业务符合性标记为未验证。</p><div id="requirements"></div><label>仓库业务画像（JSON）<textarea name="business" placeholder='{"core_flows":["支付"],"modules":["src/payments"]}'>{}</textarea></label></div>
<div class="card"><h3>3 · 运行设置</h3><label><input name="verification" type="checkbox" checked>允许Validator调用Docker运行验证</label><p>测试收集、导入与执行仅在沙箱内进行；Docker不可用时保留静态结论并说明限制。</p><button class="primary">冻结输入并开始审查</button></div></form></section>
<section id="report" hidden><div class="row"><select id="task-select"><option value="">选择历史审查</option></select><button id="refresh">刷新</button><button id="cancel">取消任务</button><button id="export">导出Markdown</button><select id="priority"><option value="">全部风险</option><option>P0</option><option>P1</option><option>P2</option><option value="pending">待确认</option></select></div><div id="report-content"></div><details><summary>补充漏报</summary><form id="missed"><input name="path" placeholder="文件路径" required><input name="line" type="number" min="1" placeholder="行号" required><select name="stage"><option>correctness</option><option>security</option><option>contract_test</option><option>mapper</option><option>validator</option></select><textarea name="reason" placeholder="问题描述和证据" required></textarea><button>提交漏报</button></form></details></section>
<section id="trace" hidden><p>展示阶段、工具、预算、压缩及验证事实；完整材料保存在Artifact中。</p><div id="trace-content"></div></section>
<section id="monitor" hidden><div id="metrics" class="row"></div><div id="history"></div></section>
<section id="policy" hidden><p>仅显示各阶段编译策略；权限和发布门禁由服务端控制。</p><div id="policy-content"></div><button id="evolve">根据真实反馈生成候选</button><div id="candidates"></div></section>
<section id="evaluation" hidden><p>真实反馈用于进化；固定Validation/Holdout用于评测。合成机制测试不代表真实PR效果。</p><pre id="dataset"></pre><div id="evaluation-content"></div></section>
</main><script type="module" src="/assets/govern.js"></script></body></html>
