[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govern-review-harness"
version = "0.4.0"
description = "Requirement-aware code review with governed Pi sessions"
requires-python = ">=3.10"
dependencies = ["PyYAML>=5.4,<7"]

[project.optional-dependencies]
analysis = ["tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24"]

[project.scripts]
govern-harness = "evoagent.application.api:run"

[tool.setuptools]
packages = ["evoagent", "evoagent.govern", "evoagent.agents", "evoagent.application", "evoagent.core", "evoagent.evaluation", "evoagent.evolution", "evoagent.infrastructure", "evoagent.integrations", "evoagent.memory", "evoagent.repair", "evoagent.runtime", "evoagent.storage", "evoagent.skills"]

[tool.setuptools.package-dir]
evoagent = "EvoAgent"
"evoagent.skills" = "skills"
