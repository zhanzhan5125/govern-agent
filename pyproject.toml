[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govern-review-harness"
version = "0.4.0"
description = "Requirement-aware code review with governed Pi sessions"
requires-python = ">=3.10"
dependencies = ["PyYAML>=5.4,<7"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.2,<4"]
container = ["redis>=5,<7", "PyJWT[crypto]>=2.8,<3", "opentelemetry-sdk>=1.24,<2"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.24,<2"]
analysis = ["tree-sitter>=0.25,<0.26", "tree-sitter-javascript>=0.25,<0.26", "tree-sitter-typescript>=0.23,<0.24"]

[project.scripts]
govern-harness = "govern.api.api:run"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["govern*"]
